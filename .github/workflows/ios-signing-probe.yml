name: iOS signing probe

# TEMPORARY. Delete once release.yml's iOS entitlement handling is fixed.
#
# release.yml's build-ios archives unsigned, so ProcessProductPackaging never runs and
# Runner.entitlements never reaches the binary; -exportArchive then re-signs an app that
# carries no entitlements and the CarPlay key is silently absent from the ipa. This probe
# runs the archive/export pair on demand — no version bump, no tag, no release, no
# TestFlight upload — and reports what each stage actually embedded.
#
# Round 1 (run 33898097223) ruled out the obvious route: overriding CODE_SIGN_IDENTITY on
# the command line cannot beat the pbxproj's sdk-qualified setting (xcodebuild read
# "CODE_SIGN_IDENTITY[sdk=iphoneos*]=-" as a certificate *named* 'iphoneos*]=-'), and with
# CODE_SIGN_STYLE=Manual Xcode demands a provisioning profile even for ad-hoc. Exactly what
# the comment in release.yml warned about.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: resign = ad-hoc sign the archived app by hand; cloudsign = automatic signing at archive time via the API key
        type: choice
        default: resign
        options: [resign, cloudsign]

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get

      - name: Install the App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$KEY_P8" > ~/.appstoreconnect/private_keys/"AuthKey_${KEY_ID}.p8"

      - run: flutter build ios --release --config-only

      # One step, so a failing xcodebuild cannot be masked by a pipe the way round 1's was.
      - name: Archive and report what it embedded
        env:
          VARIANT: ${{ inputs.variant }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -eo pipefail
          ARCHIVE=build/ios/archive/Runner.xcarchive
          APP="$ARCHIVE/Products/Applications/Runner.app"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          if [ "$VARIANT" = cloudsign ]; then
            # Leave every signing setting as the pbxproj has it (automatic, team set) and
            # hand the archive the same credentials the export step gets. If Xcode can mint
            # or fetch a cloud-managed certificate here, ProcessProductPackaging runs and
            # the entitlements land in the binary the way they do for macOS.
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE" archive \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"
          else
            # Archive unsigned exactly as release.yml does today, then ad-hoc sign the
            # archived app by hand with the entitlements. Touches no build setting, so it
            # cannot upset the SwiftPM plugin targets — and ad-hoc needs no keychain.
            # The export below re-signs everything with the real certificate; all this has
            # to achieve is getting the entitlements into the binary for export to carry
            # over, which is the same shape macOS already relies on.
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE" archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

            # Nested code first: codesign refuses a bundle whose frameworks are unsigned.
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign - {} \;
            [ -d "$APP/PlugIns" ] && find "$APP/PlugIns" -maxdepth 1 -name '*.appex' \
              -exec codesign --force --sign - {} \; || true
            codesign --force --sign - --generate-entitlement-der \
              --entitlements ios/Runner/Runner.entitlements "$APP"
          fi

          echo "=== what the ARCHIVE carries (the stage release.yml never checked) ==="
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - \
            || echo "(no entitlements / not signed)"
          [ -d "$APP/Frameworks/Mpv.framework" ] && echo "Mpv.framework: present" \
            || echo "Mpv.framework: MISSING"

      - name: Export and report what the ipa carries
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -eo pipefail
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>68TXJMQZH4</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          rm -rf "$RUNNER_TEMP/ipacheck"
          unzip -q build/ios/ipa/*.ipa -d "$RUNNER_TEMP/ipacheck"
          APP=$(echo "$RUNNER_TEMP/ipacheck/Payload/"*.app)
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/e.plist"
          echo "=== what the IPA carries ==="
          plutil -p "$RUNNER_TEMP/e.plist"
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.carplay-audio' \
               "$RUNNER_TEMP/e.plist" 2>/dev/null | grep -q true; then
            echo "RESULT: carplay-audio survived"
          else
            echo "RESULT: carplay-audio MISSING"
            exit 1
          fi
