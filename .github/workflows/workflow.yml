# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Conventional commits are what release.yml derives the version bump and the release-note
  # sections from, so a subject that does not follow them silently costs a release its notes.
  commit-lint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the subjects against the convention
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --no-merges --pretty='%s' "${BASE}..${HEAD}" |
                grep -vP '^[a-z]+(\(.+\))?!?: .+' || true)
          if [ -n "$bad" ]; then
            echo "::error::These commit subjects are not conventional commits:"
            printf '  %s\n' "$bad"
            echo "Expected: <type>[(scope)][!]: <description>  — see CONTRIBUTING.md"
            exit 1
          fi
          echo "all commit subjects follow the convention"

  build:
    # Skip the commit release.yml pushes: it is version bookkeeping, already built green as the
    # commit it was cut from, and rebuilding it would only race the release's own image.
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          # Caches the Flutter SDK download (~1 min per run).
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          # No restore-keys fallback: a cache from an older pubspec.lock can hold the
          # git-dependency mirrors without a newly pinned commit, and pub's mid-resolution
          # fetch then drops their transitive deps and corrupts package_graph.json.
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available

      - name: Install dependencies from Apt
        run: |
          sudo apt update -y && sudo apt upgrade -y;
          
          # These packages are listed in the setup instructions for Linux desktop. They may not all be necessary.
          # For reference: https://docs.flutter.dev/get-started/install/linux/desktop
          sudo apt install -y curl git unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install mpv # for media_kit
        run: sudo apt install -y libmpv-dev mpv

      - name: Install libsecret # for OIDC
        run: sudo apt install -y libsecret-1-0 libsecret-1-dev libjsoncpp25 libjsoncpp-dev

      - name: Install Flutter
        # Running "flutter doctor" will download Flutter's dependencies
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Linux
        run: flutter build linux --release

      - name: Build Android
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release --wasm --no-web-resources-cdn

      - name: Upload Web Build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web/

      - name: Upload Linux Build
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/

      - name: Upload Android Build
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Compile-only gates for the two desktop platforms that cannot be built on the Linux
  # runner. They produce no release artifact — release.yml builds and attaches those —
  # but without them a Windows/macOS breakage would only surface in the nightly release.
  # Tests and analysis already ran in `build`, so these do the build and nothing else.
  build-windows:
    name: Build Windows
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: windows-latest
    env:
      # Dart's default cache on Windows is %LOCALAPPDATA%\Pub\Cache, which the cache
      # step below would never see. It matters more here than elsewhere: media_kit's
      # Windows libs download a prebuilt libmpv into the pub cache at CMake configure
      # time, so a cache miss also re-downloads that.
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\.pub-cache
          # No restore-keys fallback, for the same reason as the Linux job above.
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release

  build-macos:
    name: Build macOS
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          # No restore-keys fallback, for the same reason as the Linux job above.
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release

  # Compile gate only. The app is sideloaded from a developer's own Mac
  # (doc/user/en/00-installation.md), so there is nothing to sign here and
  # nothing installable to publish — an unsigned .ipa cannot be installed.
  # This job exists so an iOS-breaking change is caught without anyone
  # having to reach for a Mac.
  build-ios:
    name: Build iOS
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          # No restore-keys fallback, for the same reason as the Linux job above.
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      # A green build does not prove *which* libmpv got embedded: if the
      # xcframework is missing, media_kit_video silently compiles its stub
      # sources and ships an app with sound but no picture.
      - name: Verify libmpv is embedded
        run: |
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP/Frameworks/Mpv.framework" ]; then
            echo "::error::Mpv.framework missing from $APP — media_kit fell back to its stub"
            ls -la "$APP/Frameworks" || true
            exit 1
          fi
          dwarfdump --uuid "$APP/Frameworks/Mpv.framework/Mpv"

  # End-to-end: the real app against a real server in kind (deployed with the chart
  # repo's ci/up.sh, media from the testdata repo). Non-blocking while it beds in —
  # remove continue-on-error once it has proven stable.
  integration-e2e:
    name: Integration tests on kind
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Deliberately NOT continue-on-error: it hid red e2e runs for days (a green run
    # said nothing about this job), and the schema preflight below now removes the
    # main source of expected-but-confusing failures.
    steps:
      - uses: actions/checkout@v7
        with:
          path: player

      # ci/e2e-pins.env pins which chart, testdata and server build this player commit
      # is tested against — bump it there, not here. Only KEY=value lines may reach
      # GITHUB_ENV: it rejects the file's comment lines.
      - name: Read the e2e pins
        run: grep -E '^[A-Z_]+=' player/ci/e2e-pins.env >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: ister-app/chart
          ref: ${{ env.CHART_REF }}
          path: chart

      - uses: actions/checkout@v7
        with:
          repository: ister-app/testdata
          ref: ${{ env.TESTDATA_REF }}
          path: testdata

      # The e2e infrastructure (ci/up.sh and friends) only exists in newer charts. With an
      # older pinned CHART_REF the job skips cleanly instead of failing on a missing script.
      - name: Check the pinned chart supports the e2e
        id: chart-e2e
        run: |
          if [ -x chart/ci/up.sh ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::chart $CHART_REF predates ci/up.sh — skipping the integration e2e until the pin is bumped"
          fi

      - name: Resolve the testdata revision (for the cache key)
        id: testdata
        run: echo "sha=$(git -C testdata rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Same cache key scheme as the chart repo's CI, so both share the fixtures.
      - name: Restore media fixtures
        uses: actions/cache@v6
        with:
          path: |
            testdata/node1/disk1
            testdata/podcast-feed
          key: fixtures-${{ steps.testdata.outputs.sha }}-${{ hashFiles('testdata/create_mkv.sh', 'testdata/create_books.sh', 'testdata/create_comics.sh', 'testdata/create_podcast_feed.sh') }}

      - name: Trim testdata to what the cluster mounts
        run: rm -rf testdata/node2 testdata/node1/disk2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: player/pubspec.yaml
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          # No restore-keys fallback: see the pub cache step in the build job.
          key: pub-${{ runner.os }}-${{ hashFiles('player/pubspec.lock') }}

      - name: Install dependencies from Apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl git unzip xz-utils libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev mpv libsecret-1-0 libsecret-1-dev libjsoncpp25 libjsoncpp-dev xvfb dbus-x11 pulseaudio

      - uses: azure/setup-helm@v5

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Bring up the cluster
        if: steps.chart-e2e.outputs.supported == 'true'
        run: TESTDATA_DIR="$PWD/testdata" SERVER_IMAGE_TAG="$SERVER_IMAGE_TAG" chart/ci/up.sh

      - name: Start port-forwards
        if: steps.chart-e2e.outputs.supported == 'true'
        run: |
          chart/ci/e2e/forward-for-player.sh ister ister &
          sleep 5
          curl -fsS http://localhost:8080/api/.well-known/ister

      # What actually got deployed: a -snapshot tag is mutable, so the tag name in
      # ci/e2e-pins.env doesn't identify an image. The digest in the log does — and
      # when the optional SERVER_IMAGE_DIGEST pin is set, drifting away from it is
      # called out instead of having to be reconstructed after a red run.
      - name: Log the server image digest
        if: steps.chart-e2e.outputs.supported == 'true'
        run: |
          imageid=$(kubectl get pods -n ister -o json | jq -r '
            [.items[].status.containerStatuses // [] | .[] | select(.name == "server")][0].imageID // empty')
          echo "server imageID: ${imageid:-<not found>}"
          if [ -n "$SERVER_IMAGE_DIGEST" ] && [ -n "$imageid" ] \
              && [ "${imageid##*@}" != "$SERVER_IMAGE_DIGEST" ]; then
            echo "::warning::server tag $SERVER_IMAGE_TAG now resolves to ${imageid##*@}, not the noted SERVER_IMAGE_DIGEST=$SERVER_IMAGE_DIGEST — the mutable tag has moved since the pin was written"
          fi

      # Fail fast (and with a clear message) when the pinned server is behind the
      # player's GraphQL operations — historically the biggest cause of red runs,
      # surfacing half an hour in as FieldUndefined inside a random test.
      - name: Schema preflight (player operations vs the running server)
        if: steps.chart-e2e.outputs.supported == 'true'
        working-directory: player
        run: ci/schema-preflight.sh

      - name: Scan the libraries (the tests need indexed media)
        if: steps.chart-e2e.outputs.supported == 'true'
        working-directory: chart
        run: E2E_ONLY='10-*' ./ci/e2e.sh ister ister

      - name: Run the integration tests
        if: steps.chart-e2e.outputs.supported == 'true'
        working-directory: player
        run: |
          flutter pub get
          # One xvfb/dbus session around one flutter-test invocation per file: a single run
          # over the whole directory fails to relaunch the Linux app for the second file
          # ("Unable to start the app on the device"). PulseAudio provides a null sink —
          # without any audio output mpv has no clock for audio-only media, so audiobook and
          # podcast positions stay at zero forever (video carries its own clock).
          # "No tests were found." after a ✅ group is the desktop runner losing the final
          # result event when the app exits right after the last test (the reporter prints
          # ✅ on "no errors seen", the engine never records the pass). Every test in the
          # file passed, so count it as a pass — a retry can lose the event just as easily
          # (and has, twice in a row).
          # The health gate between files keeps one dying server (DB starved, pod
          # restarted) from dragging every later file down as a cascade of test
          # failures: wait for recovery, and if it does not come back, fail once
          # with an infra label instead.
          xvfb-run -a dbus-run-session -- bash -c '
            pulseaudio --start --exit-idle-time=-1 || true
            status=0
            for t in integration_test/*_test.dart; do
              waited=0
              until curl -fsS -o /dev/null --max-time 5 http://localhost:8080/api/.well-known/ister; do
                if [ "$waited" -ge 90 ]; then
                  echo "::error::infra: server still unhealthy after ${waited}s before $t — aborting the remaining files"
                  exit 1
                fi
                sleep 5; waited=$((waited + 5))
              done
              if [ "$waited" -gt 0 ]; then
                echo "::warning::server was unhealthy before $t, recovered after ${waited}s"
              fi
              echo "=== $t"
              log=$(mktemp)
              flutter test "$t" -d linux --dart-define=ISTER_TEST_MODE=true 2>&1 | tee "$log"
              code=${PIPESTATUS[0]}
              if [ "$code" -ne 0 ]; then
                if grep -q "No tests were found." "$log" \
                    && grep -q "✅" "$log" && ! grep -q "❌" "$log"; then
                  echo "--- result event lost for $t after an all-✅ run; counting as a pass"
                else
                  status=1
                fi
              fi
            done
            exit $status'

      - name: Diagnostics
        if: failure() && steps.chart-e2e.outputs.supported == 'true'
        run: |
          kubectl get pods -n ister -o wide || true
          kubectl get events -n ister --sort-by=.lastTimestamp | tail -40 || true
          # Why a container died: the doc tour failed two nights in a row on postgres
          # being hard-killed mid-tour ("database system was not properly shut down",
          # RESTARTS 1) — get pods/events/logs never said by whom. The restarted
          # containers' last state carries the reason (OOMKilled / Error) and exit code.
          echo "----- restarted containers"
          kubectl get pods -n ister -o json | jq -r '
            .items[] | .metadata.name as $pod
            | (.status.containerStatuses // [])[]
            | select(.restartCount > 0)
            | "\($pod)/\(.name): restarts=\(.restartCount) last=\(.lastState.terminated // {} | tojson)"' || true
          kubectl describe pods -n ister | grep -E "^Name:|^Containers:|^  [a-z-]+:$|Last State|Reason|Exit Code|Started|Finished|Limits|Requests|memory|cpu|OOM" || true
          echo "----- node / runner memory"
          kubectl describe node | sed -n '/Conditions:/,/^Events/p' | grep -E "MemoryPressure|DiskPressure|PIDPressure|Allocated|memory|cpu" || true
          kubectl top pods -n ister --containers || true
          free -m || true
          docker exec ister-control-plane dmesg 2>/dev/null | grep -iE "oom|killed process|out of memory" | tail -20 || true
          sudo dmesg 2>/dev/null | grep -iE "oom|killed process|out of memory" | tail -20 || true
          kubectl get pods -n ister -o name | while read -r p; do
            echo "----- $p"
            # 2000, not 100: a single Java stacktrace is ~100 lines, so a small
            # tail can show one exception and nothing of what preceded it.
            kubectl logs -n ister "$p" --all-containers --prefix --tail=2000 || true
            # The log of the *previous* instance of a restarted container is where
            # the final moments before the kill are.
            kubectl logs -n ister "$p" --all-containers --prefix --previous --tail=200 2>/dev/null || true
          done

  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: linux-build
          path: build/linux/x64/release/bundle

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: app.ister.Player.yaml
          bundle: app.ister.Player.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Web build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build/web

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/ister-app/player:main
