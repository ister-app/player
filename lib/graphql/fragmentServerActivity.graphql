fragment fragmentQueueStat on QueueStat {
    queue
    depth
    consumers
}

fragment fragmentEventFailure on EventFailure {
    nodeName
    queue
    eventType
    errorMessage
    occurredAt
}

fragment fragmentTranscodePass on TranscodePass {
    nodeName
    mediaFileId
    title
    quality
    background
    startedAt
}

fragment fragmentServerActivityEvent on ServerActivityEvent {
    type
    nodeName
    timestamp
    processing {
        queue
        eventType
        startedAt
        subject
        step
    }
    processedCount
    failedCount
    queueStats {
        ...fragmentQueueStat
    }
    failure {
        ...fragmentEventFailure
    }
    transcodes {
        ...fragmentTranscodePass
    }
}

fragment fragmentPlaybackSession on PlaybackSession {
    playQueueId
    playQueueItemId
    userId
    userName
    mediaType
    mediaId
    title
    durationInMilliseconds
    artworkImageId
    progressInMilliseconds
    playState
    nodeName
    updatedAt
    controllable
    followerCount
    deviceId
    deviceName
    anchorPositionMs
    anchorServerTimeMs
    repeatMode
}
