fragment fragmentQueueStat on QueueStat {
    queue
    depth
    consumers
}

fragment fragmentEventFailure on EventFailure {
    nodeName
    queue
    eventType
    errorMessage
    occurredAt
}

fragment fragmentTranscodePass on TranscodePass {
    nodeName
    mediaFileId
    title
    quality
    background
    startedAt
    context
    contextType
    contextId
}

fragment fragmentNodeInfo on NodeInfo {
    hostname
    startedAt
    javaVersion
    availableProcessors
    maxMemoryBytes
    directories {
        name
        path
        type
        library
        totalBytes
        freeBytes
        writable
    }
    helperDisks {
        name
        jobs
    }
    offloadJobs
}

fragment fragmentServerActivityEvent on ServerActivityEvent {
    type
    nodeName
    timestamp
    processing {
        queue
        eventType
        startedAt
        subject
        step
        context
        contextType
        contextId
        directory
        library
    }
    processedCount
    failedCount
    queueStats {
        ...fragmentQueueStat
    }
    failure {
        ...fragmentEventFailure
    }
    transcodes {
        ...fragmentTranscodePass
    }
    nodeInfo {
        ...fragmentNodeInfo
    }
}

fragment fragmentPlaybackSession on PlaybackSession {
    playQueueId
    playQueueItemId
    userId
    userName
    mediaType
    mediaId
    title
    durationInMilliseconds
    artworkImageId
    progressInMilliseconds
    playState
    nodeName
    updatedAt
    controllable
    followerCount
    deviceId
    deviceName
    anchorPositionMs
    anchorServerTimeMs
    repeatMode
}
