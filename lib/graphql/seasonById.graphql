query seasonById($id: ID!) {
    seasonById(id: $id) {
        episodes {
            id
            number
            runtime
            voteAverage
            voteCount
            metadata {
                ...fragmentMetadata
            }
            show {
                id
            }
            images {
                ...fragmentImages
            }
            watchStatus {
                id
                playQueueItemId
                progressInMilliseconds
                watched
            }
            mediaFile {
                durationInMilliseconds
                id
                path
                size
                episodes {
                    id
                    number
                }
            }
            mediaFileParts {
                startInMilliseconds
                durationInMilliseconds
            }
        }
    }
}
