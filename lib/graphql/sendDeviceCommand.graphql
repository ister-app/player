mutation sendDeviceCommand($deviceId: ID!, $command: DeviceCommandType!, $mediaType: MediaType, $mediaId: ID, $startId: ID, $playQueueId: ID, $positionInMilliseconds: Float, $targetDeviceId: ID) {
    sendDeviceCommand(deviceId: $deviceId, command: $command, mediaType: $mediaType, mediaId: $mediaId, startId: $startId, playQueueId: $playQueueId, positionInMilliseconds: $positionInMilliseconds, targetDeviceId: $targetDeviceId)
}
