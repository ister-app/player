fragment fragmentMovie on Movie {
    id
    name
    releaseYear
    images { ...fragmentImages }
    metadata { ...fragmentMetadata }
    watchStatus { id playQueueItemId progressInMilliseconds watched }
    mediaFile { ...fragmentMediaFiles }
    cast { ...fragmentCastMember }
    rating
    tmdbId
    imdbId
    voteAverage
    voteCount
    runtime
    contentRating
    status
    homepage
    collectionName
    studios
    originCountry
    keywords
    trailerKey
    trailerSite
}
