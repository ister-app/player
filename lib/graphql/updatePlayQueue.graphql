mutation updatePlayQueue($id: ID!, $playQueueItemId: ID!, $progressInMilliseconds: Int!, $streamSettings: StreamSettingsInput, $playState: PlayState, $anchorPositionMs: Int, $anchorServerTimeMs: Float) {
    updatePlayQueue(id: $id, playQueueItemId: $playQueueItemId, progressInMilliseconds: $progressInMilliseconds, streamSettings: $streamSettings, playState: $playState, anchorPositionMs: $anchorPositionMs, anchorServerTimeMs: $anchorServerTimeMs) {
        ...fragmentPlayQueue
    }
}
