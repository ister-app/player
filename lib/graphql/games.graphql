query games($page: Int, $size: Int, $sorting: SortingEnum, $sortingOrder: SortingOrder, $libraryId: ID, $platform: GamePlatform) {
    games(page: $page, size: $size, sorting: $sorting, sortingOrder: $sortingOrder, libraryId: $libraryId, platform: $platform) {
        content { ...fragmentGame savePathSource }
        totalPages totalElements number size
    }
}
