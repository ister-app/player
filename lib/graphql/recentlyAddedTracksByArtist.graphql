# The newest tracks of this artist (as primary/featured artist or album
# artist) by the date they were added to the library. Same shape as the other
# per-artist lists so the tab plays through an ARTIST queue (RECENTLY_ADDED).
query recentlyAddedTracksByArtist($id: ID) {
    personById(id: $id) {
        id
        recentlyAddedTracks(limit: 10) {
            ...fragmentTrack
            dateAdded
            album { ...fragmentAlbum }
        }
    }
}
