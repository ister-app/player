query rankedPodcasts($libraryId: ID!, $kind: RankKind!, $page: Int, $size: Int) {
    libraryById(id: $libraryId) {
        id
        rankedPodcasts(kind: $kind, page: $page, size: $size) {
            number
            size
            totalElements
            totalPages
            content { ...fragmentPodcast }
        }
    }
}
