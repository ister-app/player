mutation sendPlaybackCommand($playQueueId: ID!, $command: PlaybackCommandType!, $positionInMilliseconds: Int, $playQueueItemId: ID, $repeatMode: RepeatMode) {
    sendPlaybackCommand(playQueueId: $playQueueId, command: $command, positionInMilliseconds: $positionInMilliseconds, playQueueItemId: $playQueueItemId, repeatMode: $repeatMode)
}
